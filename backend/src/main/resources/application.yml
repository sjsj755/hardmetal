server:
  port: 8080

spring:
  application:
    name: hardmetal-export
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/trade
    username: ${DB_USER:hardmetal}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # PG JDBC 默认把会话时区设成 JVM 默认值，这里强制 UTC，保证落库时间语义
      connection-init-sql: "SET TIME ZONE 'UTC'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除列是 PG 原生 boolean，不能用 MP 默认的 0/1
      logic-not-delete-value: 'false'
      logic-delete-value: 'true'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 生产必须用环境变量 JWT_SECRET 覆盖，长度 >= 32 字节
    secret: ${JWT_SECRET}
    ttl-seconds: 7200
    # 刷新令牌 7 天，一次性轮换（《接口文档》2.1）
    refresh-ttl-seconds: 604800
  auth:
    max-failed: 5
    lock-minutes: 15