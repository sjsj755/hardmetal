server:
  port: 8080

spring:
  application:
    name: hardmetal-export
  config:
    # 敏感配置放在仓库根目录的 .env（已被 .gitignore 忽略），模板见 .env.example。
    # 从仓库根目录或 backend 目录启动都能读到；文件缺失时忽略，交给环境变量或启动失败提示。
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/trade}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # PG JDBC 默认把会话时区设成 JVM 默认值，这里强制 UTC，保证落库时间语义
      connection-init-sql: "SET TIME ZONE 'UTC'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除列是 PG 原生 boolean，不能用 MP 默认的 0/1
      logic-not-delete-value: 'false'
      logic-delete-value: 'true'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 运维探针：只暴露 health；数据库/Redis 不可用时 Actuator 自动返回 503。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

app:
  jwt:
    # 密钥来自 .env 的 JWT_SECRET（或同名环境变量）；长度 < 32 字节应用启动即失败
    secret: ${JWT_SECRET}
    ttl-seconds: 7200
    # 刷新令牌 7 天，一次性轮换（《接口文档》2.1）
    refresh-ttl-seconds: 604800
  auth:
    max-failed: 5
    lock-minutes: 15