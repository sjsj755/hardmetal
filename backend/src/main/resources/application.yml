server:
  port: 8080

spring:
  application:
    name: hardmetal-export
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/trade
    username: ${DB_USER:hardmetal}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # PG JDBC 默认把会话时区设成 JVM 默认值，这里强制 UTC，保证落库时间语义
      connection-init-sql: "SET TIME ZONE 'UTC'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html